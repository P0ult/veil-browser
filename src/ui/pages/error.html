<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' veil:; script-src veil:; img-src veil: data:">
<title>Page not available</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="i-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.2"/><path d="M12 16.2h.01"/></symbol>
</svg>

<div class="message">
  <div class="badge" style="color:var(--warn)"><svg><use href="#i-warn"/></svg></div>
  <h1 id="head">This page did not load</h1>
  <p id="why"></p>
  <div class="mono" id="url"></div>
  <div class="actions">
    <button class="btn primary" id="retry">Try again</button>
    <button class="btn" id="back">Go back</button>
    <button class="btn" id="search">Search for it</button>
  </div>
</div>

<script src="theme.js"></script>
<script src="error.js"></script>
</body>
</html>
