<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' veil:; script-src veil:; img-src veil: data: https:; font-src veil:">
<title>Search</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
</svg>

<div class="results-head">
  <div class="wrap wide row">
    <div class="mark" id="mark" title="Veil search">
      <i class="veil-mark"></i>
      <span class="name">Veil</span>
    </div>
    <form class="searchbox" id="form" autocomplete="off">
      <svg><use href="#i-search"/></svg>
      <input id="q" type="text" spellcheck="false" autocomplete="off" autocorrect="off"
             autocapitalize="off" placeholder="Search" aria-label="Search">
      <button class="go" type="submit">Search</button>
    </form>
  </div>
</div>

<div class="wrap wide" style="flex:1">
  <div class="verticals" id="verticals"></div>
  <div class="meta" id="meta"></div>
  <!-- Results on the left, the knowledge panel on the right, as everyone
       expects it. On a narrow window the panel goes back above the results. -->
  <div class="serp">
    <div id="out"></div>
    <aside id="side"></aside>
  </div>
</div>

<script src="theme.js"></script>
<script src="search.js"></script>
</body>
</html>
