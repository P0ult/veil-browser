<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' veil:; script-src veil:; img-src veil: data: https:; font-src veil:">
<title>Veil tabs</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="rail.css">
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 18.5h14"/></symbol>
</svg>

<div id="rail" data-collapsed="0">

  <div class="head">
    <div class="brand" title="Veil"><i class="veil-mark icon"></i></div>
    <i class="veil-word name" role="img" aria-label="Veil"></i>
  </div>

  <!-- Shortcuts live here rather than on the start page: they are reachable
       from any page this way, not only from a blank one. -->
  <div class="shortcuts" id="shortcuts"></div>

  <div class="tabs" id="tabs"></div>

  <!-- Directly under the tabs, where the list ends - not pinned to the floor. -->
  <button class="add" id="new-tab" title="New tab (Ctrl+T)">
    <svg class="icon"><use href="#i-plus"/></svg><span>New tab</span>
  </button>

  <div class="spacer"></div>

  <div class="foot">
    <button id="go-downloads" title="Downloads">
      <svg class="icon"><use href="#i-download"/></svg><span>Downloads</span>
    </button>
    <button id="go-settings" title="Settings">
      <svg class="icon"><use href="#i-gear"/></svg><span>Settings</span>
    </button>
  </div>

</div>

<script src="theme.js"></script>
<script src="rail.js"></script>
</body>
</html>
