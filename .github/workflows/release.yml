# Builds Veil and uploads it to a DRAFT GitHub release.
#
# Push a tag that matches the version in package.json:
#
#     npm version 1.0.1 && git push --follow-tags
#
# Nothing reaches anyone until you open Releases and press Publish. Until then
# electron-updater ignores the draft, so a half-finished build cannot be handed
# to people who already have Veil installed.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write        # needed to create the release and upload assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # electron-builder uploads the installer and its blockmap as separate
      # tasks. GitHub allows several drafts to share one tag, so if neither
      # task finds an existing release they both create one and the assets end
      # up split across two drafts. Making the release first means both upload
      # into the same place.
      - name: Open the draft release first
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes 'Unsigned build. Windows will show "Windows protected your PC" - choose More info, then Run anyway.'
          fi

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Apple Silicon. This has to run on a Mac - a .dmg cannot be produced on
  # Windows - and GitHub's macos-latest runners are arm64, so the build is
  # native rather than cross-compiled.
  #
  # It waits for the Windows job so that only one of the two creates the draft
  # release; both would otherwise race and split the assets across two drafts.
  macos:
    needs: windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no Developer ID certificate here. Without this,
          # electron-builder hunts for one and fails the build rather than
          # producing the unsigned app we actually want.
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Ubuntu and anything close to it: an AppImage that runs anywhere without
  # installing, and a .deb for apt. Both are x64 - Linux on arm is a different
  # audience and nobody has asked for it.
  #
  # Waits for the Windows job for the same reason macOS does: one job creates
  # the draft, the rest upload into it.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run release:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
